name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # OpenPMIx minimum required by pmix-rs (threading model + API surface).
  OPENPMIX_VERSION: "6.1.0"
  PRTE_VERSION: "3.0.8"

jobs:
  ############################################################################
  # Regular tests — OpenPMIx ≥ 6.1 from source, libclang for bindgen
  ############################################################################
  test:
    name: Regular tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libevent-dev libhwloc-dev \
            libclang-dev clang

      - name: Cache OpenPMIx ${{ env.OPENPMIX_VERSION }}
        id: cache-openpmix
        uses: actions/cache@v4
        with:
          path: openpmix-${{ env.OPENPMIX_VERSION }}
          key: openpmix-${{ env.OPENPMIX_VERSION }}-ubuntu-24.04-v1

      - name: Build OpenPMIx ${{ env.OPENPMIX_VERSION }}
        if: steps.cache-openpmix.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PREFIX="$GITHUB_WORKSPACE/openpmix-${OPENPMIX_VERSION}"
          cd /tmp
          git clone --depth 1 --branch "v${OPENPMIX_VERSION}" --recurse-submodules \
            https://github.com/openpmix/openpmix.git "openpmix-${OPENPMIX_VERSION}"
          cd "openpmix-${OPENPMIX_VERSION}"
          ./autogen.pl
          ./configure --prefix="$PREFIX" --disable-debug CFLAGS="-O2"
          make -j"$(nproc)"
          make install

      - name: Export PMIX_PREFIX
        run: |
          PREFIX="$GITHUB_WORKSPACE/openpmix-${OPENPMIX_VERSION}"
          echo "PMIX_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          test -f "$PREFIX/include/pmix.h"
          grep -E 'PMIX_VERSION_MAJOR[[:space:]]+6' "$PREFIX/include/pmix_version.h"
          grep -E 'PMIX_VERSION_MINOR[[:space:]]+1' "$PREFIX/include/pmix_version.h"

      - name: Build
        run: cargo build --all-targets

      - name: Assert working tree stayed clean
        run: |
          # Bindings must land only in OUT_DIR — never under src/ or elsewhere tracked.
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: cargo build dirtied the working tree:"
            git status --porcelain
            git diff --stat || true
            exit 1
          fi
          if [ -e src/bindings.rs ]; then
            echo "ERROR: src/bindings.rs must not exist after build"
            exit 1
          fi
          echo "Working tree clean after cargo build."

      - name: Run regular tests
        run: cargo test

  ############################################################################
  # Daemon tests — build PRTE (bundles OpenPMIx), start daemon, run ignored tests
  ############################################################################
  daemon-tests:
    name: Daemon tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libevent-dev libhwloc-dev \
            libclang-dev clang

      - name: Cache PRTE build
        id: cache-prte
        uses: actions/cache@v4
        with:
          path: prte-${{ env.PRTE_VERSION }}
          key: prte-${{ env.PRTE_VERSION }}-ubuntu-24.04-internal-pmix-v1

      - name: Download and build PRTE
        if: steps.cache-prte.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          curl -fsSL "https://github.com/openpmix/prrte/archive/refs/tags/v${PRTE_VERSION}.tar.gz" \
            -o prrte-${PRTE_VERSION}.tar.gz
          tar xzf prrte-${PRTE_VERSION}.tar.gz
          cd prrte-${PRTE_VERSION}

          if [ -f autogen.pl ]; then
            ./autogen.pl
          fi

          ./configure \
            --prefix="$GITHUB_WORKSPACE/prte-${PRTE_VERSION}" \
            --with-pmix=internal \
            --disable-cuda \
            --disable-java \
            CFLAGS="-O2" CXXFLAGS="-O2"

          make -j"$(nproc)"
          make install

      - name: Start PRTE daemon
        run: |
          PRTE_HOME="$GITHUB_WORKSPACE/prte-${PRTE_VERSION}"
          export PATH="$PRTE_HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$PRTE_HOME/lib:$LD_LIBRARY_PATH"

          URI_DIR="$GITHUB_WORKSPACE/prte_uri"
          mkdir -p "$URI_DIR"

          "$PRTE_HOME/bin/prte" \
            --report-uri "$URI_DIR/uri" \
            --no-ready-msg &
          PRTE_PID=$!

          echo "PRTE PID: $PRTE_PID"
          echo "PRTE_PID=$PRTE_PID" >> "$GITHUB_ENV"
          echo "PRTE_URI_DIR=$URI_DIR" >> "$GITHUB_ENV"
          echo "PRTE_HOME=$PRTE_HOME" >> "$GITHUB_ENV"
          # Point bindgen/link at PRTE's bundled OpenPMIx.
          echo "PMIX_PREFIX=$PRTE_HOME" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            if [ -f "$URI_DIR/uri" ]; then
              echo "PRTE URI file ready after ${i}s"
              cat "$URI_DIR/uri"
              break
            fi
            sleep 1
          done

          if [ ! -f "$URI_DIR/uri" ]; then
            echo "ERROR: PRTE URI file not created within 30 seconds"
            exit 1
          fi

          kill -0 "$PRTE_PID" || { echo "PRTE daemon exited prematurely"; exit 1; }

      - name: Build Rust crate
        run: |
          export PATH="$PRTE_HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$PRTE_HOME/lib:$LD_LIBRARY_PATH"
          export PMIX_PREFIX="$PRTE_HOME"
          cargo build --all-targets

      - name: Assert working tree stayed clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: cargo build dirtied the working tree:"
            git status --porcelain
            exit 1
          fi

      - name: Run daemon-dependent tests (ignored)
        run: |
          export PATH="$PRTE_HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$PRTE_HOME/lib:$LD_LIBRARY_PATH"
          export PMIX_PREFIX="$PRTE_HOME"
          export PMIX_TEST_URI_FILE="$PRTE_URI_DIR/uri"

          echo "=== Running tool_tool_init daemon tests ==="
          cargo test --test tool_tool_init -- --ignored --test-threads=1

          echo "=== Running lib_core_api daemon tests ==="
          cargo test --test lib_core_api -- --ignored --test-threads=1

          echo "=== Running fabric_fabric_comprehensive daemon tests ==="
          cargo test --test fabric_fabric_comprehensive -- --ignored --test-threads=1

      - name: Stop PRTE daemon
        if: always()
        run: |
          if [ -n "${{ env.PRTE_PID }}" ]; then
            kill "${{ env.PRTE_PID }}" 2>/dev/null || true
            sleep 2
            kill -9 "${{ env.PRTE_PID }}" 2>/dev/null || true
          fi

  ############################################################################
  # DVM-launched tests — run via prterun
  ############################################################################
  dvm-tests:
    name: DVM tests (via prterun)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libevent-dev libhwloc-dev \
            libclang-dev clang

      - name: Cache PRTE build
        id: cache-prte
        uses: actions/cache@v4
        with:
          path: prte-${{ env.PRTE_VERSION }}
          key: prte-${{ env.PRTE_VERSION }}-ubuntu-24.04-internal-pmix-v1

      - name: Download and build PRTE
        if: steps.cache-prte.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          curl -fsSL "https://github.com/openpmix/prrte/archive/refs/tags/v${PRTE_VERSION}.tar.gz" \
            -o prrte-${PRTE_VERSION}.tar.gz
          tar xzf prrte-${PRTE_VERSION}.tar.gz
          cd prrte-${PRTE_VERSION}

          if [ -f autogen.pl ]; then
            ./autogen.pl
          fi

          ./configure \
            --prefix="$GITHUB_WORKSPACE/prte-${PRTE_VERSION}" \
            --with-pmix=internal \
            --disable-cuda \
            --disable-java \
            CFLAGS="-O2" CXXFLAGS="-O2"

          make -j"$(nproc)"
          make install

      - name: Build Rust crate
        run: |
          PRTE_HOME="$GITHUB_WORKSPACE/prte-${PRTE_VERSION}"
          export PATH="$PRTE_HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$PRTE_HOME/lib:$LD_LIBRARY_PATH"
          export PMIX_PREFIX="$PRTE_HOME"
          cargo build --test init_via_prterun

      - name: Assert working tree stayed clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: cargo build dirtied the working tree:"
            git status --porcelain
            exit 1
          fi

      - name: Run DVM-launched tests via prterun
        run: |
          PRTE_HOME="$GITHUB_WORKSPACE/prte-${PRTE_VERSION}"
          export PATH="$PRTE_HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$PRTE_HOME/lib:$LD_LIBRARY_PATH"
          export PMIX_PREFIX="$PRTE_HOME"

          prterun -np 1 --report-uri /tmp/prte_uri/uri \
            cargo test --test init_via_prterun -- --ignored --test-threads=1

  ############################################################################
  # Lint / clippy
  ############################################################################
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libevent-dev libhwloc-dev \
            libclang-dev clang

      - name: Cache OpenPMIx ${{ env.OPENPMIX_VERSION }}
        id: cache-openpmix
        uses: actions/cache@v4
        with:
          path: openpmix-${{ env.OPENPMIX_VERSION }}
          key: openpmix-${{ env.OPENPMIX_VERSION }}-ubuntu-24.04-v1

      - name: Build OpenPMIx ${{ env.OPENPMIX_VERSION }}
        if: steps.cache-openpmix.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PREFIX="$GITHUB_WORKSPACE/openpmix-${OPENPMIX_VERSION}"
          cd /tmp
          git clone --depth 1 --branch "v${OPENPMIX_VERSION}" --recurse-submodules \
            https://github.com/openpmix/openpmix.git "openpmix-${OPENPMIX_VERSION}"
          cd "openpmix-${OPENPMIX_VERSION}"
          ./autogen.pl
          ./configure --prefix="$PREFIX" --disable-debug CFLAGS="-O2"
          make -j"$(nproc)"
          make install

      - name: Export PMIX_PREFIX
        run: |
          PREFIX="$GITHUB_WORKSPACE/openpmix-${OPENPMIX_VERSION}"
          echo "PMIX_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Clippy check
        run: cargo clippy --all-targets -- -D warnings

      - name: Assert working tree stayed clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: cargo clippy dirtied the working tree:"
            git status --porcelain
            exit 1
          fi
